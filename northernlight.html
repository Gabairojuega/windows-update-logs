<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>...</title>
<style>
  body {
    background: #000;
    color: #eee;
    font-family: monospace;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    overflow: hidden;
  }
  #glitch {
    position: relative;
  }
  .flicker {
    animation: flicker 0.08s steps(1) infinite;
  }
  @keyframes flicker {
    0%   { opacity: 1; transform: translate(0,0); }
    20%  { opacity: 0.3; transform: translate(-2px,1px); }
    40%  { opacity: 0.8; transform: translate(2px,-1px); }
    60%  { opacity: 0.2; transform: translate(-1px,-1px); }
    80%  { opacity: 0.9; transform: translate(1px,1px); }
    100% { opacity: 1; transform: translate(0,0); }
  }
</style>
</head>
<body>

<div id="glitch">
  <div id="noise" class="flicker">░▒▓█▓▒░ ▓▒░█▒▓ ░▓█▒░▓▒</div>
  <div id="eyes" style="display:none;">
    <svg width="200" height="100" viewBox="0 0 200 100">
      <ellipse cx="60" cy="50" rx="35" ry="25" fill="#eee"/>
      <ellipse cx="140" cy="50" rx="35" ry="25" fill="#eee"/>
      <circle id="pupilL" cx="60" cy="50" r="10" fill="#000"/>
      <circle id="pupilR" cx="140" cy="50" r="10" fill="#000"/>
    </svg>
  </div>
</div>

<script>
  setTimeout(() => {
    const noise = document.getElementById('noise');
    const eyes = document.getElementById('eyes');
    noise.remove();
    eyes.style.display = 'block';

    document.addEventListener('mousemove', (e) => {
      moveEye('pupilL', 60, 50, e.clientX, e.clientY);
      moveEye('pupilR', 140, 50, e.clientX, e.clientY);
    });
  }, 1400);

  function moveEye(id, baseX, baseY, mouseX, mouseY) {
    const svg = document.querySelector('svg');
    const rect = svg.getBoundingClientRect();
    const originX = rect.left + baseX;
    const originY = rect.top + baseY;

    const angle = Math.atan2(mouseY - originY, mouseX - originX);
    const maxDist = 8;
    const px = baseX + Math.cos(angle) * maxDist;
    const py = baseY + Math.sin(angle) * maxDist;

    document.getElementById(id).setAttribute('cx', px);
    document.getElementById(id).setAttribute('cy', py);
  }
</script>

</body>
</html>
